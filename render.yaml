services:
  - type: web
    name: verivault
    runtime: python
    plan: starter          # a paid plan is required for the persistent disk below
    buildCommand: ./build.sh
    startCommand: "python manage.py migrate --noinput && gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /
    disk:
      name: verivault-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: VERIVAULT_SECRET_KEY
        generateValue: true
      - key: VERIVAULT_DEBUG
        value: "False"
      - key: VERIVAULT_HTTPS
        value: "True"
      - key: VERIVAULT_DATA_DIR
        value: /var/data
      # Set these two to your actual Render URL once you know it
      # (Render shows it as soon as the service is created):
      - key: VERIVAULT_ALLOWED_HOSTS
        value: verivault.onrender.com
      - key: VERIVAULT_CSRF_TRUSTED_ORIGINS
        value: https://verivault.onrender.com
      - key: VERIVAULT_SITE_URL
        value: https://verivault.onrender.com
